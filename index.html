<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prosintesi Partner — Diventa Agente</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="brand">
        <div class="logo">🔷</div>
        <h1>Prosintesi <span>Partner</span></h1>
      </div>
      <p class="subtitle">Compila il form per diventare agente affiliato. Ti contatteremo entro 24h.</p>

      <form id="partner-form">
        <h3>🏢 Dati Attività</h3>
        <div class="grid-2">
          <input type="text" name="ragione_sociale" placeholder="Ragione Sociale *" required>
          <input type="text" name="p_iva" placeholder="Partita IVA">
        </div>
        <input type="text" name="tipo_attivita" placeholder="Tipo attività (es. Agenzia immobiliare) *" required>
        <div class="grid-2">
          <input type="text" name="provincia" placeholder="Provincia *" required>
          <input type="text" name="citta" placeholder="Città *" required>
        </div>
        <input type="text" name="indirizzo_attivita" placeholder="Indirizzo attività *" required>
        <input type="url" name="sito_web" placeholder="Sito web (opzionale)">

        <h3>🧑‍💼 Dati Referente</h3>
        <div class="grid-2">
          <input type="text" name="nome" placeholder="Nome *" required>
          <input type="text" name="cognome" placeholder="Cognome *" required>
        </div>
        <div class="grid-2">
          <input type="email" name="email" placeholder="Email *" required>
          <input type="tel" name="telefono" placeholder="Telefono *" required>
        </div>

        <h3>🛠️ Servizi che vuoi proporre</h3>
        <div class="checkbox-group">
          <label><input type="checkbox" name="servizi" value="immobiliare"> 🏠 Immobiliare</label>
          <label><input type="checkbox" name="servizi" value="fotovoltaico"> ☀️ Fotovoltaico</label>
          <label><input type="checkbox" name="servizi" value="cessione_quinto"> 💰 Cessione del Quinto</label>
          <label><input type="checkbox" name="servizi" value="mutui"> 🏦 Mutui</label>
          <label><input type="checkbox" name="servizi" value="climatizzazione"> ❄️ Climatizzazione</label>
          <label><input type="checkbox" name="servizi" value="efficienza_energetica"> 🌿 Efficienza Energetica</label>
        </div>

        <h3>📝 Note</h3>
        <textarea name="note" rows="3" placeholder="Messaggio o informazioni aggiuntive (opzionale)"></textarea>

        <label class="privacy">
          <input type="checkbox" name="privacy" required>
          Accetto la <a href="#" target="_blank">Privacy Policy</a> e il trattamento dei dati *
        </label>

        <button type="submit" id="submit-btn">
          <span class="btn-text">Invia richiesta</span>
          <span class="btn-loader" style="display:none">⏳ Invio in corso...</span>
        </button>
      </form>

      <div id="success-msg" class="success" style="display:none">
        <div class="success-icon">✅</div>
        <h3>Richiesta inviata!</h3>
        <p>Ti contatteremo entro 24 ore per attivare la tua collaborazione.</p>
        <button onclick="location.reload()" class="btn-secondary">Invia un'altra richiesta</button>
      </div>

      <div id="error-msg" class="error" style="display:none"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
